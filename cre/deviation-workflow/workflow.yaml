# Secrets: the default price source (Yahoo) needs none, so secrets-path is left out. To use Finnhub, add it to `providers`,
# export FINNHUB_API_KEY_ENV, and uncomment secrets-path in the target you run.
# Targets must also exist in ../project.yaml (CLI merges both; workflow.yaml wins on conflicts).
# All three targets use the same code; only receiver/RPC differ (see scripts/set-receiver.ts).
staging-settings:
  user-workflow:
    workflow-name: "deviationfee-refprice-staging"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.staging.json"
    # secrets-path: "../secrets.yaml"   # only needed if "finnhub" is added to `providers`; the CLI requires every listed env var to exist

production-settings:
  user-workflow:
    workflow-name: "deviationfee-refprice"
    # Optional (CLI >= 1.14): "private" = Chainlink-hosted registry, no wallet/gas needed for registry ops.
    # Omit for the default onchain registry (needs a linked key + Ethereum Mainnet gas). Run `cre registry list`.
    # deployment-registry: "private"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.production.json"
    # secrets-path: "../secrets.yaml"   # only needed if "finnhub" is added to `providers`; the CLI requires every listed env var to exist

fork-settings:
  user-workflow:
    workflow-name: "deviationfee-refprice-fork"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.fork.json"
    # secrets-path: "../secrets.yaml"   # only needed if "finnhub" is added to `providers`; the CLI requires every listed env var to exist
