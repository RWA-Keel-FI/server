# Only read when "finnhub" is listed in `providers` of a config (Yahoo needs no key).
# Left side = id used in code (runtime.getSecret({ id })), right side = env var holding the value (.env or shell).
# Values are never stored in this repo. For a deployed workflow, push them with `cre secrets create`.
secretsNames:
  FINNHUB_API_KEY:
    - FINNHUB_API_KEY_ENV
